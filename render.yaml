# Render alternative, for a deployment with no CLI step.
#
# Same posture as fly.toml: offline mode, no payment credentials on the host.
# ANVIL_CONSOLE_PASSWORD is set in the Render dashboard, never here.
services:
  - type: web
    name: anvil
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ANVIL_MODE
        value: offline
      - key: ANVIL_ENV
        value: demo
      - key: ANVIL_LOG_FORMAT
        value: json
      - key: ANVIL_SEED
        value: "20260902"
      - key: ANVIL_PUBLIC_BASE_URL
        value: https://anvil.rohanbatra.in
      - key: ANVIL_CONSOLE_USERNAME
        value: reviewer
      - key: ANVIL_CONSOLE_PASSWORD
        sync: false          # set in the dashboard; never committed
