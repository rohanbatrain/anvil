# Fly.io deployment for the public demonstration at anvil.rohanbatra.in
#
# Deliberately minimal, and the important line is what is absent: there are no
# Razorpay or Anthropic credentials here or in Fly secrets. The public instance
# runs in offline mode against the seeded simulator, so it cannot leak a
# payment key -- there is none on the machine -- and cannot move money.
#
# The only secret this deployment holds is ANVIL_CONSOLE_PASSWORD, which gates
# the console and protects nothing but the demonstration itself.

app = "anvil-rohanbatra"
primary_region = "bom"          # Mumbai: the audience and the domain are Indian

[build]
  dockerfile = "Dockerfile"

[env]
  ANVIL_MODE = "offline"
  ANVIL_ENV = "demo"
  ANVIL_LOG_FORMAT = "json"
  ANVIL_LOG_LEVEL = "INFO"
  ANVIL_SEED = "20260902"
  ANVIL_PUBLIC_BASE_URL = "https://anvil.rohanbatra.in"
  ANVIL_CONSOLE_USERNAME = "reviewer"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  # One machine always warm. The console builds its seeded world and starts a
  # queue of paused graphs at startup, so a cold start is a few seconds of work
  # a reviewer should not have to wait through.
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

[[http_service.checks]]
  grace_period = "30s"
  interval = "20s"
  method = "GET"
  timeout = "5s"
  path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  # The batch experiment simulates thousands of subscriptions in a worker
  # thread. 512MB is comfortable; 256MB is not.
  memory = "512mb"
  cpus = 1
