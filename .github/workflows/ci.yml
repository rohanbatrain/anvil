name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check anvil tests scripts
          ruff format --check anvil tests scripts

      - name: Types
        run: mypy anvil
        continue-on-error: true

      # No database, no network, no credentials. If this needs a service
      # container, something has leaked out of the integration suite.
      - name: Tests
        run: pytest tests/unit -q

      - name: Financial invariants
        run: pytest -m invariant -q

      # The tour and the batch are user-facing entry points. A submission whose
      # headline command is broken is worse than one that never had it.
      - name: Guided tour runs
        run: python scripts/tour.py > /dev/null

      - name: Batch experiment runs
        run: python -m anvil.evidence.run_batch --size 400 > /dev/null

  migrations:
    name: migrations apply cleanly
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: anvil
          POSTGRES_PASSWORD: anvil
          POSTGRES_DB: anvil
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Apply migrations
        env:
          ANVIL_DATABASE_URL: postgresql+asyncpg://anvil:anvil@localhost:5432/anvil
        run: alembic upgrade head
      - name: Append-only guard is installed
        env:
          PGPASSWORD: anvil
        run: |
          psql -h localhost -U anvil -d anvil -tAc \
            "select count(*) from pg_trigger where tgname like '%immutable%'" | grep -q '^4$'
